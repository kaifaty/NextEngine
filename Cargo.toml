[workspace]
members = [
    "apps/game",
    "apps/headless",
    "crates/agent",
    "crates/application",
    "crates/assets",
    "crates/contracts",
    "crates/desktop-sdl-ash",
    "crates/mechanics",
    "crates/platform",
    "crates/plugin-host",
    "crates/presentation",
    "crates/physics-api",
    "crates/physics-physx",
    "crates/physics-physx-ffi",
    "crates/project",
    "crates/reference-game",
    "crates/render",
    "crates/rpg",
    "crates/runtime",
    "crates/script-luau",
    "crates/verification",
    "crates/world",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "Apache-2.0"
repository = ""

[workspace.dependencies]
next_contracts = { path = "crates/contracts" }
next_agent = { path = "crates/agent" }
next_application = { path = "crates/application" }
next_assets = { path = "crates/assets" }
next_desktop_sdl_ash = { path = "crates/desktop-sdl-ash" }
next_mechanics = { path = "crates/mechanics" }
next_platform = { path = "crates/platform" }
next_plugin_host = { path = "crates/plugin-host" }
next_presentation = { path = "crates/presentation" }
next_physics_api = { path = "crates/physics-api" }
next_physics_physx = { path = "crates/physics-physx" }
next_physics_physx_ffi = { path = "crates/physics-physx-ffi" }
next_project = { path = "crates/project" }
next_reference_game = { path = "crates/reference-game" }
next_render = { path = "crates/render" }
next_rpg = { path = "crates/rpg" }
next_runtime = { path = "crates/runtime" }
next_script_luau = { path = "crates/script-luau" }
next_verification = { path = "crates/verification" }
next_world = { path = "crates/world" }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
sdl3 = { version = "=0.18.4", features = ["ash", "build-from-source-static"] }
mlua = { version = "=0.12.0", default-features = false, features = ["luau"] }
wasmtime = { version = "=45.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wat"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# goblin's high-level ELF64 parser currently references its ELF32 layout module.
# Keep every unrelated format disabled while enabling that compile-time companion.
goblin = { version = "=0.10.7", default-features = false, features = ["std", "elf32", "elf64", "pe64"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.nextengine.ffi]
allowed_crates = ["next_desktop_sdl_ash", "next_physics_physx_ffi"]
