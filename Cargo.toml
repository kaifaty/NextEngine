[workspace]
members = [
    "apps/headless",
    "crates/contracts",
    "crates/runtime",
    "crates/verification",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "Apache-2.0"
repository = ""

[workspace.dependencies]
next_contracts = { path = "crates/contracts" }
next_runtime = { path = "crates/runtime" }
next_verification = { path = "crates/verification" }
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.nextengine.ffi]
allowed_crates = []
