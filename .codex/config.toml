#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.qmd]
command = "node"
args = ["tools/qmd/mcp.mjs"]
cwd = "."
enabled = true
required = false
enabled_tools = ["query", "get", "multi_get", "status"]
default_tools_approval_mode = "approve"
startup_timeout_sec = 60
tool_timeout_sec = 180
