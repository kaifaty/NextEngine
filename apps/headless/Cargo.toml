[package]
name = "next_headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Opt-in Tracy profiling: links the Tracy client, starts it on process entry
# and enables runtime stage zones. Developer telemetry only.
profile-tracy = ["dep:tracy-client", "next_application/profile-tracy"]

[dependencies]
next_application.workspace = true
next_contracts.workspace = true
tracy-client = { workspace = true, optional = true }

[dev-dependencies]
next_assets.workspace = true
next_project.workspace = true
next_reference_game.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
