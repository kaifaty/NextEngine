[project]
name = "nextengine-emotion-probe"
version = "0.1.0"
description = "Isolated microphone and file probe for emotion2vec+"
requires-python = "==3.12.*"
dependencies = [
    "funasr==1.4.2",
    "huggingface-hub==1.27.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]

[project.scripts]
next-emotion-probe = "nextengine_emotion_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextengine_emotion_probe"]

[tool.uv]
managed = true
