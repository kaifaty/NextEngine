[project]
name = "nextengine-speech-timeline"
version = "0.1.0"
description = "Resident speech timeline service and isolated emotion2vec+ probe"
requires-python = "==3.12.*"
dependencies = [
    "funasr==1.4.2",
    "huggingface-hub==1.27.0",
    "numpy==2.5.2",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==5.15.0",
    "websockets==17.0.1",
]

[project.scripts]
next-emotion-probe = "nextengine_emotion_probe.cli:main"
next-speech-timeline = "nextengine_speech_timeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextengine_emotion_probe", "src/nextengine_speech_timeline"]

[tool.uv]
managed = true
